<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Organization Agentic Platform</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Organization Agentic Platform: the collaborative workspace of humans and agents." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0f1c" media="(prefers-color-scheme: dark)" />
    <!-- frame-ancestors and report-uri cannot be set from a meta element: the serving instance adds them as HTTP headers. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <!-- Relative URLs: the build's base href (root or a sub-path such as /oap-web-frontend/) applies. -->
    <link rel="icon" href="oap.svg" type="image/svg+xml" />
    <script src="runtime-config.js"></script>
  </head>
  <body>
    <sai-root></sai-root>
  </body>
</html>
